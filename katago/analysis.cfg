# QiDao interactive configuration for KataGo's JSON analysis engine.
# Per-position limits are supplied in each request by the application.

reportAnalysisWinratesAs = BLACK
analysisPVLen = 15
conservativePass = true

# QiDao analyzes one live position at a time. Give that position enough
# search threads while keeping memory use predictable on Apple Silicon.
numAnalysisThreads = 1
numSearchThreads = 8
nnMaxBatchSize = 8

nnCacheSizePowerOfTwo = 19
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# Keep engine protocol data on stdout only. Diagnostic output is read from
# stderr by the application and saved in debug/qidao.log.
logAllRequests = false
logAllResponses = false
logSearchInfo = false
